title = "frankenbeast gitleaks config"

# Extend gitleaks' built-in ruleset rather than replacing it, so real-secret
# detection (private keys, API tokens, cloud credentials, etc.) stays at full
# strength. `gitleaks detect --source .` with no `--config` flag auto-loads
# this file (it lives at the scan root), so no CI workflow change is needed —
# see .github/workflows/daily-security-scan.yml.
[extend]
useDefault = true

# ── False positive: synthetic PEM fixture in a redaction-utility test ─────
# Issue #3779: gitleaks' `private-key` rule flagged
# packages/franken-orchestrator/tests/unit/adapters/planning-faculty-adapter.test.ts:154
#
#   goal: `-----BEGIN PRIVATE KEY-----\n${'A'.repeat(3_000)}\n-----END PRIVATE KEY-----`
#
# This is not a real key: it's a unit test verifying that a redaction
# utility strips PEM-looking blocks out of text before it reaches a lesson
# query. The "key body" is a repeated filler character generated by
# `'A'.repeat(n)`, not real key material (entropy ~4.3 for this match, versus
# ~5.7+ for real base64-encoded key bytes of that length).
#
# Scoped to the `private-key` rule specifically (other rules are untouched),
# and requires ALL of the following (`condition = "and"`) so a real
# accidentally-committed private key still gets flagged:
#   - `paths`: only test files.
#   - `regexes`: the PEM header must be immediately followed by the
#     tell-tale synthetic-fixture shape — a JS template-literal
#     `.repeat(...)` call, or 20+ repeats of a single character. Real
#     base64-encoded key bytes never look like that.
# This is intentionally NOT a blanket "ignore private-key in test files"
# allowlist — a real key pasted into a test file, with normal-looking
# base64 body, would still be caught.
[[rules]]
id = "private-key"

[[rules.allowlists]]
description = "Synthetic PEM fixtures (repeated filler chars) in redaction-utility tests"
condition = "and"
regexTarget = "match"
paths = [
  '''.*\.test\.tsx?$''',
]
regexes = [
  '''-----BEGIN[ A-Z0-9_-]*PRIVATE KEY-----\\n\$\{['"]?.['"]?\.repeat\(''',
  # Go's RE2 engine (used by gitleaks) has no backreference support, so this
  # can't be a generic "any repeated character" pattern; it enumerates the
  # filler characters commonly used for this kind of fixture instead.
  '''-----BEGIN[ A-Z0-9_-]*PRIVATE KEY-----\\n(?:[Aa]{20,}|[Xx]{20,}|[Zz]{20,}|0{20,}|1{20,})''',
]
